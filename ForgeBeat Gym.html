<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ForgeBeat Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&family=Roboto:wght@400;600&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eef1f4; --surface: #ffffff; --ink: #14202b; --muted: #556677; --line: #d5dce3;
  --accent: #f2d13d; --on-accent: #14202b; --btn-bg: #14202b; --btn-fg: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c; --surface: #16212b; --ink: #e9eef3; --muted: #93a3b3; --line: #263544;
    --btn-bg: #f2d13d; --btn-fg: #14202b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c; --surface: #16212b; --ink: #e9eef3; --muted: #93a3b3; --line: #263544;
  --btn-bg: #f2d13d; --btn-fg: #14202b; color-scheme: dark;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 "Barlow", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 1.25rem 1.25rem 3rem; }
.wrap { max-width: 1040px; margin: 0 auto; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", Impact, sans-serif; line-height: 1.05; letter-spacing: .005em; }
h2 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: .6rem; }
h3 { font-size: 1.5rem; margin-bottom: .35rem; }
p { max-width: 62ch; }
.muted { color: var(--muted); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
 
/* nav */
.nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1rem; padding-bottom: 1rem; border-bottom: 2px solid var(--ink); margin-bottom: 2.5rem; }
.brand { font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 700; font-size: 1.9rem; text-decoration: none; color: var(--ink); line-height: 1; }
.brand i { font-style: normal; background: var(--accent); color: var(--on-accent); padding: 0 .3rem; margin-left: .1rem; }
.nav ul { display: flex; flex-wrap: wrap; gap: .25rem; list-style: none; }
.nav a.link { display: block; text-decoration: none; color: var(--ink); font-weight: 600; padding: .4rem .8rem; border-radius: 6px; }
.nav a.link:hover { background: var(--line); }
.nav a.link[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.langs { display: flex; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.langs button { font: inherit; font-weight: 600; cursor: pointer; background: transparent; color: var(--ink); border: 0; padding: .3rem .65rem; }
.langs button:hover { background: var(--line); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
 
/* buttons */
.btn { display: inline-block; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; background: var(--btn-bg); color: var(--btn-fg); border: 2px solid var(--btn-bg); border-radius: 6px; padding: .75rem 1.4rem; }
.btn:hover { opacity: .88; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.6rem; }
 
/* home */
.hero h1 { font-size: clamp(2.8rem, 9vw, 6rem); font-weight: 700; max-width: 14ch; }
.hero p { margin-top: 1.1rem; font-size: 1.15rem; color: var(--muted); }
.pulse { display: block; width: 100%; height: 90px; margin: 2.5rem 0 .5rem; overflow: visible; }
.pulse path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.2s ease-out .2s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse path { animation: none; stroke-dashoffset: 0; } }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 2rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.3rem; }
.card p { color: var(--muted); font-size: .98rem; }
 
/* tables */
.tablewrap { overflow-x: auto; margin-top: 1.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 520px; }
th, td { text-align: left; padding: .85rem 1.1rem; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .9rem; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; }
 
/* pricing */
.plan { display: flex; flex-direction: column; }
.plan.pop { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.plan.pop p, .plan.pop .per { color: var(--on-accent); }
.price { font-family: "Barlow Condensed", Impact, sans-serif; font-size: 3.2rem; font-weight: 700; line-height: 1; margin: .5rem 0; }
.per { font-size: 1rem; font-weight: 400; color: var(--muted); font-family: "Barlow", sans-serif; }
.plan ul { list-style: none; margin: 1rem 0 1.5rem; display: grid; gap: .45rem; flex: 1; }
.plan li::before { content: "+ "; font-weight: 700; }
.plan.pop .btn { background: var(--on-accent); color: var(--accent); border-color: var(--on-accent); }
.tag { align-self: flex-start; font-weight: 600; font-size: .85rem; background: var(--on-accent); color: var(--accent); padding: .1rem .6rem; border-radius: 99px; margin-bottom: .4rem; }
 
.free { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; border: 2px solid var(--ink); }
.free h3 { margin-bottom: .2rem; }
.sec2 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 3.2rem 0 .3rem; }
.steps { list-style: none; counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 1.2rem; }
.steps li { counter-increment: s; }
.steps li::before { content: counter(s); display: block; font-family: "Barlow Condensed", Impact, sans-serif; font-size: 2.6rem; font-weight: 700; line-height: 1; margin-bottom: .3rem; }
.role { color: var(--muted); font-weight: 600; font-size: .95rem; margin-bottom: .5rem; }
.band { background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 1.6rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; margin-top: 3rem; }
.band h2 { margin: 0 0 .4rem; }
.band p { margin-top: 0; color: var(--on-accent); }
.band .btn { background: var(--on-accent); color: var(--accent); border-color: var(--on-accent); }
.faq { display: grid; gap: .7rem; margin-top: 1.2rem; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.2rem; }
summary { cursor: pointer; font-weight: 600; }
.faq details p { margin-top: .6rem; font-size: 1rem; color: var(--muted); }
.quote { font-size: 1.05rem; }
.cite { margin-top: .8rem; font-weight: 600; font-size: .9rem; color: var(--muted); }
/* contact */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 1.5rem; }
.info { display: grid; gap: 1.1rem; align-content: start; }
.info b { display: block; }
form { display: grid; gap: 1rem; }
label { font-weight: 600; font-size: .95rem; display: grid; gap: .3rem; }
input, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .7rem .8rem; width: 100%; }
textarea { min-height: 120px; resize: vertical; }
.ok { background: var(--accent); color: var(--on-accent); padding: .8rem 1rem; border-radius: 6px; font-weight: 600; }
footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
@media (max-width: 700px) { .split { grid-template-columns: 1fr; } body { font-size: 16px; } }
</style>
</head>
